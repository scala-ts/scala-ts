name: CI

on:
  push:
    branches: master
  pull_request:
    branches: master
  merge_group:

jobs:
  build_n_test:
    name: 'Build & Test core and SBT plugins'
    runs-on: ubuntu-latest

    steps:
    - name: 'Checkout repository'
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: 'Set up JDK 25'
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: 25

    - name: Setup sbt launcher
      uses: sbt/setup-sbt@v1

    - name: 'Coursier cache'
      uses: coursier/cache-action@v7
      with:
        extraKey: coursier-${{ runner.os }}-${{ hashFiles('**/*.sbt') }}-${{ hashFiles('project/build.properties') }}

    - name: 'Compile'
      run: 'sbt -J-Dscalafix.disable=true Test/compile'

    - name: 'Check code quality' # TODO: Separate job
      run: |
        sbt ';warn ;scalafixAll -check ;scalafmtCheckAll'

    - name: 'Run core tests' # single retry
      run: |
        sbt -J-Dscalafix.disable=true +core/testOnly || (
          sleep 2s
          sbt -J-Dscalafix.disable=true +core/testOnly
        )

    - parallel:
        - name: 'Run idtl tests'
          run: 'sbt -J-Dscalafix.disable=true +idtlt/testOnly'

        - name: 'Run python tests'
          run: 'sbt -J-Dscalafix.disable=true +python/testOnly'

    - name: 'Publish local'
      run: 'sbt -J-Dscalafix.disable=true +publishLocal'

    - parallel:
        - name: 'Run SBT plugin tests (Scala 2.x)'
          run: |
              sbt -J-Dscalafix.disable=true -J-Dscala-ts.sbt-test-temp=/tmp/sbt-scala-ts/ \
                ';error ;++2.12 ;scripted'

        - name: 'Run SBT plugin tests (Scala 3.x)'
          run: |
              sbt -J-Dscalafix.disable=true -J-Dscala-ts.sbt-test-temp=/tmp/sbt-scala-ts/ \
                ';error ;++3.8 ;scripted'

    - name: 'Persist generated data'
      uses: actions/upload-artifact@v7
      with:
        name: tmp-generated
        path: /tmp/sbt-scala-ts/

  typescript:
    name: 'Validate TypeScript code generation'
    runs-on: ubuntu-latest
    needs: build_n_test

    steps:
    - name: 'Checkout repository'
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - uses: actions/download-artifact@v8
      with:
        name: tmp-generated
        path: /tmp/sbt-scala-ts

    - name: 'Set up Node'
      uses: actions/setup-node@v7
      with:
        node-version: '22'

    - name: 'Compile TypeScript generated from SBT scripted tests'
      run: |
        cp sbt-plugin/src/node/*.* /tmp/sbt-scala-ts/
        cd /tmp/sbt-scala-ts/
        find . -type f -name '*.ts' -print
        npm ci
        npm run build

    - name: 'Run TypeScript tests'
      run: |
        cd /tmp/sbt-scala-ts/
        npm run test
        export TD="$OLDPWD/sbt-plugin/target"
        test -d "$TD" || mkdir -p "$TD"
        cp junit.xml "$TD/junit.xml"

  python:
    name: 'Validate Python code generation'
    runs-on: ubuntu-latest
    needs: build_n_test

    steps:
    - name: 'Checkout repository'
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - uses: actions/download-artifact@v8
      with:
        name: tmp-generated
        path: /tmp/sbt-scala-ts

    - uses: actions/setup-python@v4
      with:
        python-version: '3.8' 

    - name: 'Check Python generated from SBT scripted tests'
      run: |
        export TD=/tmp/sbt-scala-ts/sbt-plugin-test-python-full/target/scala-ts
        ls "$TD"
        cp sbt-plugin-python/src/sbt-test/Pipfile "$TD/Pipfile"
        cp sbt-plugin-python/src/sbt-test/sbt-scala-ts-python/full/src/test/resources/setup.py "$TD/setup.py"
        cd "$TD"
        which pipenv || pip install pipenv
        pipenv install --dev
        python generated/*.py
        pipenv run flake8 --ignore=E501 generated/
        pipenv run mypy --namespace-packages --explicit-package-bases generated/

    - name: 'Run Python tests'
      run: |
        export TD=/tmp/sbt-scala-ts/sbt-plugin-test-python-full/target/scala-ts
        cp -R sbt-plugin-python/src/sbt-test/sbt-scala-ts-python/full/src/test/python "$TD/tests"
        cd "$TD"
        pipenv run mypy --namespace-packages --explicit-package-bases tests/*.py
        pipenv run python -m pytest tests/*.py

  publish:
    name: 'Publish artifacts'
    runs-on: ubuntu-latest
    needs: [typescript, python]

    steps:
    - name: 'Checkout repository'
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: 'Set up JDK 25'
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: 25

    - name: Setup sbt launcher
      uses: sbt/setup-sbt@v1

    - name: 'Publish snapshot (master)'
      if: ${{ github.ref == 'refs/heads/master' }}
      env:
        PUBLISH_REPO_NAME: "Sonatype Nexus Repository Manager"
        PUBLISH_REPO_ID: "central.sonatype.com"
        PUBLISH_REPO_URL: "https://central.sonatype.com/repository/maven-snapshots/"
        PUBLISH_USER: ${{ secrets.SONATYPE_USER }}
        PUBLISH_PASS: ${{ secrets.SONATYPE_PASSWORD }}
      run: |
        sbt -J-Dscalafix.disable=true +publish
