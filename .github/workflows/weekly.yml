on:
  schedule:
    - cron: '0 12 * * 0'
name: weekly

permissions:
  contents: write
  pull-requests: write

jobs:
  scala-steward:
    runs-on: ubuntu-latest
    name: Scala Steward
    steps:
      - name: Scala Steward
        uses: scala-steward-org/scala-steward-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          branches: 'master,demo/akka-http-svlete,demo/akka-idtlt'
